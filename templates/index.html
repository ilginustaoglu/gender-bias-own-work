<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Answer Round Analizi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">CSV analizi</p>
        <h1>Answer Round</h1>
      </div>
      <label class="upload">
        <input id="file-input" type="file" accept=".csv" multiple />
        <span>CSV yükle</span>
      </label>
    </header>

    <nav id="file-nav" class="navbar" hidden></nav>

    <main>
      <section id="empty-state" class="empty">
        <h2>Dosya seçin</h2>
        <p>
          Birden fazla CSV yükleyin. Yalnızca
          <code>answer_round</code> ile başlayan kolonlar sayılır: he, she, reject
          ve diğerleri. Standart olmayan değerler dosya bazında, en altta tek tek listelenir.
        </p>
      </section>

      <section id="results" hidden>
        <p id="file-meta" class="meta"></p>
        <div class="stats" id="stats"></div>
        <section class="others-wrap">
          <div class="others-head">
            <h2>He / she / reject / he/she yazmayan kolonlar</h2>
            <p id="others-count"></p>
          </div>
          <div id="others-list"></div>
        </section>
      </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
