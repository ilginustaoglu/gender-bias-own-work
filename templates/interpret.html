<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interpret reports</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Llama 3.1</p>
        <h1>Interpret reports</h1>
      </div>
      <div class="top-actions">
        <a class="action" href="{{ url_for('index') }}">Back</a>
        <label class="upload">
          <input id="file-input" type="file" accept=".pdf" multiple />
          <span>Upload reports</span>
        </label>
      </div>
    </header>

    <main>
      <section id="empty-state" class="empty">
        <h2>Upload count reports</h2>
        <p>
          Choose one or more PDF reports generated by this app. The local
          <code>llama3.1</code> model will read the counts and write a short
          commentary, which you can export as a PDF.
        </p>
      </section>

      <p id="status" class="status" hidden>Interpreting with Llama 3.1…</p>

      <section id="results" hidden>
        <p class="eyebrow">Interpretation</p>
        <div class="results-toolbar">
          <h2 id="interp-title" class="interp-title"></h2>
          <button type="button" id="export-pdf" class="action">Export PDF</button>
        </div>
        <p id="file-meta" class="meta"></p>
        <div id="interp-body" class="interp-body"></div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='interpret.js') }}"></script>
  </body>
</html>
